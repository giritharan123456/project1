# AdzConnect on Render - single service, single URL, zero external dependencies.
# The Express backend serves the built frontend (../dist) itself, so the API,
# WebSocket, and SPA all live on one service: https://adzconnect.onrender.com
#
# A MariaDB server is installed at build time and initialized + seeded at boot
# (see deploy/install-deps.sh and deploy/start.sh). This keeps everything
# self-contained on the free tier. Note: free-tier instances sleep after idle
# and get a fresh ephemeral disk on wake, so the DB is re-initialized and
# re-seeded on each cold start (demo data only).

services:
  - type: web
    name: adzconnect
    runtime: node
    repo: https://github.com/giritharan123456/project1
    rootDir: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    buildCommand: bash deploy/install-deps.sh && npm ci --include=dev && npm run build && cd backend && npm ci
    startCommand: bash deploy/start.sh
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: connectly
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: connectly
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: OTP_EXPIRES_MINUTES
        value: 5
