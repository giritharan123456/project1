# AdzConnect on Render - single service, single URL.
# The Express backend serves the built frontend (../dist) itself, so the API,
# WebSocket, and SPA all live on one service: https://adzconnect.onrender.com
#
# MySQL is an EXTERNAL free instance. After creation, set DB_HOST, DB_PORT,
# DB_USER, DB_PASSWORD, DB_NAME on the service and run `npm run migrate`
# (or `npm run seed`) as a one-off job.

services:
  - type: web
    name: adzconnect
    runtime: node
    repo: https://github.com/giritharan123456/project1
    rootDir: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build && cd backend && npm ci
    startCommand: node backend/server.js
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: OTP_EXPIRES_MINUTES
        value: 5
